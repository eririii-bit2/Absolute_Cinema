<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABSOLUTE CINEMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="navbar navbar-expand-lg sticky-top border-bottom border-dark py-3" style="background-color: rgba(10,11,16,0.95); backdrop-filter: blur(10px);">
    <div class="container">
      <a class="navbar-brand cinema-brand d-flex align-items-center gap-2" href="browse.html">
        <i class="bi bi-film fs-3"></i> ABSOLUTE CINEMA
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link text-secondary" href="browse.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="location.html">Cinema Location</a></li>
        </ul>
        <form class="d-flex me-3" action="search.html" method="GET">
          <div class="input-group">
            <input class="form-control bg-dark text-light border-secondary" type="search" name="q" placeholder="Search movies...">
            <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
          </div>
        </form>
        <div class="d-flex gap-2">
          <a href="notifications.html" class="btn btn-cinema-outline position-relative"><i class="bi bi-bell"></i></a>
          <a href="profile.html" class="btn btn-cinema-outline"><i class="bi bi-person"></i></a>
        </div>
      </div>
    </div>
  </nav>
 <main class="py-4">
    <div class="container">
      <div class="bg-cinema-card p-4 p-md-5 mb-4">
        <div class="row g-4 align-items-center">
          <div class="col-md-4">
            <img id="detail-img" src="" class="img-fluid rounded-3 shadow" alt="Movie Poster">
          </div>
          <div class="col-md-8">
            <span id="detail-format" class="badge badge-format mb-2"></span>
            <h1 id="detail-title" class="display-5 fw-bold mb-2"></h1>
            <p id="detail-meta" class="text-muted mb-3"></p>
            <p id="detail-description" class="lead text-light mb-4"></p>
            <div class="row g-3 mb-4">
              <div class="col-6 col-sm-3">
                <small class="text-muted d-block">Rating</small>
                <span id="detail-rating" class="fw-bold text-warning"></span>
              </div>
              <div class="col-6 col-sm-3">
                <small class="text-muted d-block">Director</small>
                <span id="detail-director" class="fw-bold"></span>
              </div>
              <div class="col-6 col-sm-3">
                <small class="text d-block">Ticket Price</small>
                <span id="detail-price" class="fw-bold text-danger"></span>
              </div>
            </div>
            <a id="location-btn" href="location.html" class="btn btn-cinema btn-lg"><i class="bi bi-geo-alt me-2"></i>Select Location and Time</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- Footer -->
  <footer class="border-top border-dark py-4 mt-auto" style="background-color: #07080b;">
    <div class="container text-center text-muted">
      <p class="mb-1">&copy; 2026 ABSOLUTE CINEMA. All rights reserved.</p>
      <small>Experience movies in IMAX 3D, Dolby Atmos & VIP Recliner Seats.</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
