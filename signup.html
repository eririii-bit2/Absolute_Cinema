<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABSOLUTE CINEMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Header -->
  <nav class="navbar navbar-expand-lg sticky-top border-bottom border-dark py-3" style="background-color: rgba(10,11,16,0.95); backdrop-filter: blur(10px);">
    <div class="container">
      <a class="navbar-brand cinema-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-film fs-3"></i> ABSOLUTE CINEMA
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link text-secondary" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="categories.html">Categories</a></li>
          <li class="nav-item"><a class="nav-link text-secondary" href="location.html">Cinema Location</a></li>
        </ul>
        <form class="d-flex me-3" action="search.html" method="GET">
          <div class="input-group">
            <input class="form-control bg-dark text-light border-secondary" type="search" name="q" placeholder="Search movies...">
            <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
          </div>
        </form>
        <div class="d-flex gap-2">
          <a href="notifications.html" class="btn btn-cinema-outline position-relative"><i class="bi bi-bell"></i><span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span></a>
          <a href="profile.html" class="btn btn-cinema-outline"><i class="bi bi-person"></i></a>
          <a href="login.html" class="btn btn-cinema">Log In</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="py-4">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="bg-cinema-card p-4 p-md-5">
        <h3 class="fw-bold mb-4 text-center">Make It A Movie Night</h3>
        <form action="login.html">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control bg-dark text-light border-secondary" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-cinema w-100 mb-3">Create Account</button>
          <p class="text-center text-muted small">Already have an account? <a href="login.html" class="text-danger">Log In</a></p>
        </form>
      </div>
    </div>
  </div>
</div>
  </main>
  <!-- Footer -->
  <footer class="border-top border-dark py-4 mt-auto" style="background-color: #07080b;">
    <div class="container text-center text-muted">
      <p class="mb-1">&copy; 2026 ABSOLUTE CINEMA. All rights reserved.</p>
      <small>Experience movies in IMAX 3D, Dolby Atmos & VIP Recliner Seats.</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
