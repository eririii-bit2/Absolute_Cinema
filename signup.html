<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABSOLUTE CINEMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Header -->



  <main class="py-4">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="bg-cinema-card p-4 p-md-5">
        <h3 class="fw-bold mb-4 text-center">Make It A Movie Night</h3>
        <form action="login.html">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="Juan Dela Cruz" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control bg-dark text-light border-secondary" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-cinema w-100 mb-3">Create Account</button>
          <p class="text-center text-muted small">Already have an account? <a href="login.html" class="text-danger">Log In</a></p>
        </form>
      </div>
    </div>
  </div>
</div>
  </main>
  <!-- Footer -->
  <footer class="border-top border-dark py-4 mt-auto" style="background-color: #07080b;">
    <div class="container text-center text-muted">
      <p class="mb-1">&copy; 2026 ABSOLUTE CINEMA. All rights reserved.</p>
      <small>Experience movies in IMAX 3D, Dolby Atmos & VIP Recliner Seats.</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
