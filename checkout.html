<div class="p-5"><a href="select-seats.html" class="link-light"><i class="bi bi-arrow-left fs-1"></i></a></div>

<main class="py-4">

<div class="container py-3">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="bg-cinema-card p-4 p-md-5">
        <h3 class="fw-bold mb-4"><i class="bi bi-credit-card text-danger me-2"></i>Payment Checkout</h3>
        <form id="checkout-form" action="confirmation.html">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" value="Juan Dela Cruz" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control bg-dark text-light border-secondary" value="juan@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select class="form-select bg-dark text-light border-secondary">
              <option>Credit / Debit Card</option>
              <option>GCash / E-Wallet</option>
              <option>PayPal</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="**** **** **** 1234" required>
          </div>
          <button id="checkout-submit-btn" type="submit" class="btn btn-cinema w-100 btn-lg mt-3">Confirm Payment (₱0)</button>
        </form>
      </div>
    </div>
  </div>
